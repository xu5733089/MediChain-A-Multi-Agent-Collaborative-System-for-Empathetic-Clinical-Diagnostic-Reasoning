version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"

  backend:
    build: ./medichain-backend
    env_file: ./medichain-backend/.env
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    volumes:
      - ./medichain-backend/medichain.db:/app/medichain.db
      - ./medichain-backend/uploads:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      - qdrant

  frontend:
    build: ./medichain-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  qdrant_data:
